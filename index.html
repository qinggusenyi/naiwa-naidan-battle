<script>
const MAX_HP=100,MATCH_SECONDS=150;
// Customize these two settings to replace grade groups and their entire question sets.

let game={grade:LEVELS[0].id,started:false,ended:false,finishing:false,countdown:false,demo:false,hp:{left:100,right:100},streak:{left:0,right:0},round:{left:0,right:0},q:{left:null,right:null},options:{left:[],right:[]},wrong:{left:[],right:[]},locked:{left:false,right:false},used:{left:new Set(),right:new Set()},lastType:{left:'',right:''},matchDeadline:0,note:'左右各自答题，答对立刻攻击！',token:0};
function pick(rows){return rows[Math.floor(Math.random()*rows.length)]}

function other(side){return side==='left'?'right':'left'}
function mathQ(){let a,b,op,g=game.grade;if(g===1){a=1+Math.floor(Math.random()*10);b=1+Math.floor(Math.random()*10);op=pick(['+','−']);if(op==='−'&&b>a)[a,b]=[b,a]}else if(g===2){op=pick(['+','−','×']);a=op==='×'?2+Math.floor(Math.random()*5):10+Math.floor(Math.random()*60);b=op==='×'?2+Math.floor(Math.random()*7):2+Math.floor(Math.random()*25);if(op==='−'&&b>a)[a,b]=[b,a]}else{op=pick(['+','−','×','÷']);if(op==='÷'){b=2+Math.floor(Math.random()*7);a=b*(2+Math.floor(Math.random()*8))}else{a=op==='×'?3+Math.floor(Math.random()*7):20+Math.floor(Math.random()*80);b=op==='×'?2+Math.floor(Math.random()*8):5+Math.floor(Math.random()*40);if(op==='−'&&b>a)[a,b]=[b,a]}}let answer=op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:a/b,values=new Set([answer]);for(let d of shuffle([-5,-3,-2,-1,1,2,3,4,6,8])){if(answer+d>=0)values.add(answer+d);if(values.size===4)break}return {key:'math:'+(op==='+'||op==='×'?[Math.min(a,b),op,Math.max(a,b)]:[a,op,b]).join(':'),type:'math',art:`${a} ${op} ${b} = ?`,prompt:'算出正确答案',choices:[...values].map(String),answer:String(answer)}}
function englishQ(side){let pool=game.grade===1?ENGLISH.slice(0,12):ENGLISH,available=pool.filter(x=>!game.used[side].has('english:'+x[0])),row=pick(available.length?available:pool),otherWords=shuffle(pool.filter(x=>x[0]!==row[0])).slice(0,3);return {key:'english:'+row[0],type:'english',art:row[1],prompt:'这张图的英文是什么？',choices:[row[0],...otherWords.map(x=>x[0])],answer:row[0]}}
function idiomQ(side){let pool=game.grade===1?IDIOMS.slice(0,8):IDIOMS,available=pool.filter(x=>!game.used[side].has('idiom:'+x[0])),row=pick(available.length?available:pool),extra=pick(shuffle(IDIOMS.flatMap(x=>[x[1],...x[2]])).filter(x=>x!==row[1]&&!row[2].includes(x)));return {key:'idiom:'+row[0],type:'idiom',art:row[0],prompt:'补全这个成语',choices:[row[1],...row[2],extra],answer:row[1]}}
function prepareQuestion(side){let pool=QUESTION_BANK[game.grade],type,q;if(pool?.length){let fresh=pool.filter((_,i)=>!game.used[side].has('custom:'+i)),candidates=fresh.length?fresh:pool,alternate=candidates.filter(row=>row.type!==game.lastType[side]),row=pick(alternate.length?alternate:candidates);type=row.type;q={...row,key:'custom:'+pool.indexOf(row),choices:row.choices.map(String),answer:String(row.answer)}}else{type=pick(['math','english','idiom'].filter(x=>x!==game.lastType[side]));q=type==='math'?mathQ():type==='english'?englishQ(side):idiomQ(side);if(type==='math')for(let i=0;i<50&&game.used[side].has(q.key);i++)q=mathQ()}game.q[side]=q;game.used[side].add(q.key);game.lastType[side]=type;game.options[side]=shuffle(q.choices);game.wrong[side]=[];game.locked[side]=false;game.round[side]++}
function nextQuestion(side){prepareQuestion(side);drawPanel(side);if(game.demo)scheduleDemo(side)}
function start(demo=false){game.started=true;game.ended=false;game.finishing=false;game.countdown=true;game.demo=demo;game.hp={left:100,right:100};game.streak={left:0,right:0};game.round={left:0,right:0};game.q={left:null,right:null};game.options={left:[],right:[]};game.wrong={left:[],right:[]};game.locked={left:false,right:false};game.used={left:new Set(),right:new Set()};game.lastType={left:'',right:''};game.matchDeadline=0;game.note='准备开战！';game.token++;battleEffects.length=0;prepareQuestion('left');prepareQuestion('right');render();fightIntro(game.token)}
function fightIntro(token){
  const arena=document.getElementById('arena'),intro=document.createElement('div');
  intro.className='fight-intro ready';intro.innerHTML='<span class="intro-word">READY</span><span class="intro-caption">奶蛙 VS 奶蛋 · 准备出招</span>';
  arena.appendChild(intro);
  setTimeout(()=>{if(token!==game.token)return;intro.className='fight-intro go';intro.innerHTML='<span class="intro-word">GO!</span><span class="intro-caption">答对就攻击</span>'},850);
  setTimeout(()=>{if(token!==game.token)return;intro.remove();game.countdown=false;game.matchDeadline=Date.now()+MATCH_SECONDS*1000;setNote('开始！左右各做自己的题，答对立刻出招');drawPanel('left');drawPanel('right');tick();if(game.demo){scheduleDemo('left');scheduleDemo('right')}},1650)
}
function gradeOptions(){return LEVELS.map(level=>`<option value="${escapeHTML(level.id)}" ${game.grade===level.id?'selected':''}>${escapeHTML(level.label)}</option>`).join('')}
function setGrade(value){const level=LEVELS.find(level=>String(level.id)===String(value));if(!level||level.id===game.grade)return;game.grade=level.id;if(game.started&&!game.ended)start(game.demo);else if(!game.started)render()}
function home(){document.querySelectorAll('body > .overlay').forEach(box=>box.remove());game.token++;game.started=false;game.ended=false;game.finishing=false;game.countdown=false;game.demo=false;game.hp={left:100,right:100};game.streak={left:0,right:0};game.round={left:0,right:0};game.q={left:null,right:null};game.options={left:[],right:[]};game.matchDeadline=0;game.note='选择分组，准备开战';battleEffects.length=0;render()}
function setNote(message){game.note=message;let el=document.getElementById('notice');if(el)el.textContent=message}
function updateScores(){for(const side of ['left','right']){let hp=document.getElementById('hp-'+side),number=document.getElementById('number-'+side),streak=document.getElementById('streak-'+side);if(hp)hp.style.width=game.hp[side]+'%';if(number)number.textContent=game.hp[side];if(streak)streak.textContent=game.streak[side]>=2?`🔥 ${game.streak[side]} 连击`:`连击 ${game.streak[side]}`}}
function updateSide(side,message){let status=document.getElementById('status-'+side),panel=document.getElementById('panel-'+side);if(status)status.textContent=message;panel?.classList.toggle('locked',game.locked[side])}
function speak(side){let q=game.q[side];if(q?.type!=='english'||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let voice=new SpeechSynthesisUtterance(q.answer);voice.lang='en-US';voice.rate=.82;speechSynthesis.speak(voice)}catch{}}
function sound(side){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=side==='left'?'sine':'triangle';osc.frequency.setValueAtTime(side==='left'?450:780,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(side==='left'?1050:350,ctx.currentTime+.36);gain.gain.setValueAtTime(.085,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.42);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.43);osc.onended=()=>ctx.close()}catch{}}
const battleSprites={},whiteSprites={},battleEffects=[],hitLabelToken={left:0,right:0};
let battleFrame=0;
function battleNow(){return window.performance?.now?.()??Date.now()}
function whiteSprite(src,img){
  const mask=document.createElement('canvas');mask.width=img.naturalWidth;mask.height=img.naturalHeight;
  const ctx=mask.getContext('2d');ctx.drawImage(img,0,0);ctx.globalCompositeOperation='source-in';ctx.fillStyle='#fff';ctx.fillRect(0,0,mask.width,mask.height);

function battleLoop(){
  if(battleFrame||!document.getElementById('battle-canvas')?.getContext||!window.requestAnimationFrame)return;
  battleFrame=window.requestAnimationFrame(now=>{
    battleFrame=0;paintBattle(now);
    if(battleEffects.some(effect=>effect.token===game.token&&!effect.cancelled&&now-effect.start<2300))battleLoop();
  });
}
function paintBattle(now=battleNow()){
  const canvas=document.getElementById('battle-canvas');if(!canvas?.getContext)return;
  const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;
  const dpr=Math.min(window.devicePixelRatio||1,1.5),pixelW=Math.round(w*dpr),pixelH=Math.round(h*dpr);
  if(canvas.width!==pixelW||canvas.height!==pixelH){canvas.width=pixelW;canvas.height=pixelH}
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  ctx.imageSmoothingQuality='medium';

  for(const side of ['left','right']){
    const actor=ACTORS[side],hit=active.findLast(e=>e.side!==side&&now-e.start>=560&&now-e.start<1400);
    const cast=active.findLast(e=>e.side===side&&now-e.start<560),ht=hit?now-hit.start-560:-1,ct=cast?now-cast.start:-1;
    let dx=0,rotation=0,sx=1,sy=1;
    if(ct>=0){
      const dir=side==='left'?1:-1;
      if(ct<150){dx=-dir*11*ct/150;sx=1.08;sy=.91}
      else if(ct<310){dx=dir*(-11+67*(ct-150)/160);rotation=dir*.08;sx=1.06;sy=.96}
      else{dx=dir*56*(1-(ct-310)/250);rotation=dir*.04}
    }
    if(ht>=0){
      const dir=side==='left'?-1:1,travel=ht<90?ht/90:ht<250?1:Math.max(0,1-(ht-250)/520);
      dx=dir*Math.min(72,w*.15)*travel;rotation=dir*.22*travel;sx=1-.08*travel;sy=1-.12*travel;
    }
    const src=side==='left'&&ct>=0&&ct<530?actor.attackImg:actor.img;
    const img=battleSprites[src];if(!img?.complete||!img.naturalWidth)continue;
    const flash=ht>=0&&(ht<75||(ht>165&&ht<220)),draw=flash?whiteSprites[actor.img]||img:img;
    const height=h*(side==='left'?.79:.70),width=height*img.naturalWidth/img.naturalHeight,x=w*(side==='left'?.21:.79)+dx,y=h*.94;

  }

    if(t>=0&&t<160){
      const p=t/160,x=w*(effect.side==='left'?.37:.63),y=h*.49;

    }

      const img=battleSprites[ACTORS[effect.side].wave];if(img?.complete&&img.naturalWidth){
        const p=(t-160)/400,tip=w*(effect.side==='left'?.38+.41*p:.62-.41*p),width=w*.49,height=Math.min(h*.43,width*img.naturalHeight/img.naturalWidth),y=h*.46-height/2;
        ctx.save();ctx.globalAlpha=Math.min(1,(t-160)/65);ctx.translate(tip,0);if(dir<0)ctx.scale(-1,1);
        ctx.drawImage(img,-width,y,width,height);ctx.restore();
      }
    }
    if(t>=560&&t<1050){
      const dt=t-560,p=dt/490,x=w*(effect.side==='left'?.79:.21),y=h*.46,color=kind==='frog'?'#8cffe9':'#ffe497';
      ctx.save();ctx.strokeStyle=color;ctx.lineWidth=7*(1-p)+1;ctx.globalAlpha=1-p;
      ctx.beginPath();ctx.arc(x,y,20+p*92,0,Math.PI*2);ctx.stroke();
      for(let i=0;i<8;i++){const a=i*Math.PI/4,r=20+p*90;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.lineTo(x+Math.cos(a)*(r+20),y+Math.sin(a)*(r+20));ctx.stroke()}
      ctx.restore();
    }
    if(t>=560&&t<2200){
      const dt=t-560,x=w*(effect.side==='left'?.79:.21),y=h*.20-Math.min(30,dt*.025),label=`−${effect.damage} HP`;
      ctx.save();ctx.globalAlpha=dt>1700?Math.max(0,(2200-t)/500):1;
      ctx.font=`900 ${Math.max(20,Math.min(33,w*.035))}px sans-serif`;const textW=ctx.measureText(label).width,pad=17,boxW=textW+pad*2,boxH=48;
      ctx.fillStyle='#16213de8';ctx.strokeStyle=kind==='frog'?'#6affd8':'#ffd77e';ctx.lineWidth=3;
      ctx.beginPath();ctx.roundRect(x-boxW/2,y-boxH/2,boxW,boxH,13);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+1);ctx.restore();
    }
  }

}
function showDamage(side,damage){
  const label=document.getElementById('hit-'+side);if(!label)return;
  const stamp=++hitLabelToken[side];label.textContent=`−${damage} HP`;label.className='hit-label on';
  setTimeout(()=>{if(stamp===hitLabelToken[side]){label.textContent='';label.className='hit-label'}},2200)
}
function attack(side,damage,done){
  const token=game.token,effect={side,damage,start:battleNow(),token,cancelled:false};
  battleEffects.push(effect);battleLoop();sound(side);
  setTimeout(()=>{
    if(token!==game.token||game.finishing){effect.cancelled=true;return}
    showDamage(other(side),damage);done();battleLoop();
  },560)
}
function answer(side,index){if(!['left','right'].includes(side)||!game.started||game.ended||game.finishing||game.countdown||game.locked[side])return;let q=game.q[side],value=game.options[side][index];if(!q||value===undefined||game.wrong[side].includes(index))return;let buttons=[...document.querySelectorAll(`#panel-${side} .answer`)];if(value!==q.answer){game.wrong[side].push(index);game.streak[side]=0;game.locked[side]=true;buttons[index]?.classList.add('wrong');if(buttons[index])buttons[index].disabled=true;updateScores();updateSide(side,'答错！1 秒后继续');setNote(ACTORS[side].name+'答错，另一边仍在进攻');let token=game.token,round=game.round[side];setTimeout(()=>{if(token!==game.token||round!==game.round[side]||game.ended)return;game.locked[side]=false;updateSide(side,'继续答题，抢回节奏')},1000);return}game.locked[side]=true;game.streak[side]++;let damage=game.streak[side]>=3?25:game.streak[side]===2?20:16;buttons[index]?.classList.add('correct');buttons.forEach(b=>b.disabled=true);updateScores();updateSide(side,'命中！准备下一题');setNote(`${ACTORS[side].name} ${game.streak[side]} 连击 · ${ACTORS[side].attack} −${damage}`);let token=game.token;attack(side,damage,()=>{game.hp[other(side)]=Math.max(0,game.hp[other(side)]-damage);updateScores();if(game.hp[other(side)]===0){game.finishing=true;setTimeout(()=>{if(token===game.token)finish(side)},1700);return}setTimeout(()=>{if(token===game.token&&!game.ended&&!game.finishing)nextQuestion(side)},450)})}
function formatTime(seconds){let m=Math.floor(seconds/60),s=seconds%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function tick(){if(!game.started||game.ended||game.finishing||game.countdown)return;let left=Math.max(0,Math.ceil((game.matchDeadline-Date.now())/1000)),clock=document.getElementById('match-clock'),bar=document.getElementById('timer-fill');if(clock)clock.textContent=formatTime(left);if(bar)bar.style.width=(left/MATCH_SECONDS*100)+'%';if(left===0)finish(game.hp.left===game.hp.right?null:game.hp.left>game.hp.right?'left':'right')}
function scheduleDemo(side){let token=game.token,round=game.round[side],delay=side==='left'?1350:1900;setTimeout(()=>{if(token!==game.token||round!==game.round[side]||!game.demo||game.ended||game.locked[side])return;answer(side,game.options[side].indexOf(game.q[side].answer))},delay)}
function finish(winner){if(game.ended)return;game.ended=true;game.token++;render();let box=document.createElement('div');box.className='overlay';box.innerHTML=`<div class="modal"><div class="result-icon">${winner?'🏆':'🤝'}</div><h2>${winner?ACTORS[winner].name+'获胜！':'这局平手！'}</h2><p>${winner?'知识波击破了对方的血条。再来一局，看看谁能更快答题。':'双方血条相同，再来一场分胜负！'}</p><div class="rules">奶蛙 ${game.hp.left} HP　·　奶蛋 ${game.hp.right} HP<br>完成题数：奶蛙 ${game.round.left} 题，奶蛋 ${game.round.right} 题。</div><label class="grade-picker">下一局${escapeHTML(LEVEL_TITLE)} <select onchange="setGrade(this.value)">${gradeOptions()}</select></label><div class="result-actions"><button class="primary" onclick="this.closest('.overlay').remove();start(false)">再打一局</button><button class="secondary" onclick="this.closest('.overlay').remove();home()">⌂ 返回首页</button><button class="secondary" onclick="this.closest('.overlay').remove();start(true)">自动演示</button></div></div>`;document.body.appendChild(box)}
function panelHTML(side){let q=game.q[side],actor=ACTORS[side],tag=q?{math:'🧮 口算',english:'🔤 英语',idiom:'📜 成语'}[q.type]||q.type:'✨ 准备',art=q?.art||'⚔️',prompt=q?.prompt||'准备答题',options=q?game.options[side].map((value,i)=>`<button class="answer" onclick="answer('${side}',${i})" ${game.wrong[side].includes(i)||game.ended||game.countdown||game.locked[side]?'disabled':''}>${escapeHTML(value)}</button>`).join(''):'<button class="answer" disabled>准备</button><button class="answer" disabled>出招</button><button class="answer" disabled>获胜</button>';return `<div class="side-head"><span>${side==='left'?'🟢 玩家 1 · 奶蛙':'🟠 玩家 2 · 奶蛋'}</span><span class="streak" id="streak-${side}">${game.streak[side]>=2?`🔥 ${game.streak[side]} 连击`:`连击 ${game.streak[side]}`}</span></div><div class="side-prompt"><div class="prompt-top"><span class="subject">${escapeHTML(tag)}</span><span class="round-number">第 ${game.round[side]} 题</span></div><div class="prompt-body"><span class="side-art ${escapeHTML(q?.type||'')}">${escapeHTML(art)}</span><span class="side-copy">${escapeHTML(prompt)}</span></div>${q?.type==='english'?`<button class="speak" onclick="speak('${side}')">🔊 听发音</button>`:''}</div><div class="answers">${options}</div><div class="side-status" id="status-${side}">${game.countdown?'等待 GO!':game.locked[side]?'正在出招…':`答对发射${actor.attack}`}</div>`}
function drawPanel(side){let panel=document.getElementById('panel-'+side);if(panel){panel.classList.remove('locked');panel.innerHTML=panelHTML(side)}}
function render(){app.innerHTML=`<div class="shell"><header class="top"><div class="brand">奶蛙 <b>VS</b> 奶蛋 · 知识对战</div><div class="tools"><label class="tool">${escapeHTML(LEVEL_TITLE)} <select title="切换分组会开始新一局" onchange="setGrade(this.value)">${gradeOptions()}</select></label><button class="tool home" onclick="home()">⌂ 首页</button><button class="tool demo" onclick="start(true)">▶ 演示</button><button class="tool" onclick="start(false)">↻ 新一局</button></div></header><div class="scoreboard"><div class="score"><div class="score-line"><span>玩家 1 · 奶蛙 <small>薄荷波</small></span><span><b id="number-left">${game.hp.left}</b> / 100</span></div><div class="hp"><div class="hp-fill frog" id="hp-left" style="width:${game.hp.left}%"></div></div><div class="hit-label" id="hit-left"></div></div><div class="versus"><small>剩余时间</small><span id="match-clock">${formatTime(game.started&&!game.countdown?Math.max(0,Math.ceil((game.matchDeadline-Date.now())/1000)):MATCH_SECONDS)}</span></div><div class="score right"><div class="score-line"><span>玩家 2 · 奶蛋 <small>星芒波</small></span><span><b id="number-right">${game.hp.right}</b> / 100</span></div><div class="hp"><div class="hp-fill egg" id="hp-right" style="width:${game.hp.right}%"></div></div><div class="hit-label" id="hit-right"></div></div></div><main class="arena" id="arena"><canvas class="battle-canvas" id="battle-canvas" aria-label="奶蛙与奶蛋的对战画面"></canvas><div class="notice" id="notice" role="status">${game.note}</div></main><div class="quiz-grid"><section class="side-panel left" id="panel-left">${panelHTML('left')}</section><section class="side-panel right" id="panel-right">${panelHTML('right')}</section></div><div class="timer-row"><span>独立答题 · 两边都能随时出招</span><span class="timer-track"><span class="timer-fill" id="timer-fill"></span></span><span>先耗尽对手 HP 获胜</span></div><div class="footer">答对攻击 16 HP · 连续答对提升至 20、25 HP · 答错只暂停自己 1 秒</div></div>`;if(!game.started){let overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal"><div class="mini"><img src="奶蛙-play.webp" alt="奶蛙"><img src="奶蛋-play.webp" alt="奶蛋"></div><h1>双人知识对战</h1><p>左右各做自己的题。谁答得快，谁就能持续出招！</p><label class="grade-picker">选择${escapeHTML(LEVEL_TITLE)} <select onchange="setGrade(this.value)">${gradeOptions()}</select></label><div class="rules">✅ 答对立刻攻击：16 HP；连对第二题 20 HP、第三题起 25 HP。<br>❌ 答错只暂停自己 1 秒，对方不受影响。<br>⏳ 2 分 30 秒内先耗尽对方血条获胜；时间到时剩余 HP 高者赢。</div><button class="primary" onclick="this.closest('.overlay').remove();start(false)">双人开战 ✦</button><br><button class="secondary" onclick="this.closest('.overlay').remove();start(true)">自动演示 · 方便录屏</button></div>`;app.appendChild(overlay)}paintBattle()}
render();
for(const src of new Set(Object.values(ACTORS).flatMap(actor=>[actor.img,actor.attackImg,actor.wave].filter(Boolean)))){const img=new Image();battleSprites[src]=img;img.onload=()=>{if(Object.values(ACTORS).some(actor=>actor.img===src))whiteSprite(src,img);paintBattle()};img.src=src}
window.addEventListener?.('resize',()=>paintBattle());
setInterval(tick,1000);

</script>
</body>
</html>
